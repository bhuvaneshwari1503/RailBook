services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: railbook
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d railbook"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Asia/Kolkata
      DB_URL: jdbc:postgresql://db:5432/railbook?reWriteBatchedInserts=true
      DB_USERNAME: postgres
      DB_PASSWORD: secret
      JWT_SECRET: docker-demo-secret-key-change-me-0123456789
      ADMIN_PASSWORD: Admin@123
      CORS_ORIGINS: http://localhost:3000
      MAIL_ENABLED: "false"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata: